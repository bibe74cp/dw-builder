services:

  # ── SQL Server 2025 ─────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: dw-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD}\" -Q \"SELECT 1\" -C -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ── Backend API (ASP.NET Core 10) ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/DwBuilder.Api/Dockerfile
    container_name: dw-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DwBuilder: "Server=sqlserver,1433;Database=DwBuilderDW;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "DwBuilder"
      Jwt__Audience: "DwBuilderUsers"
      Jwt__ExpiryMinutes: "480"
      Encryption__Key: "${ENCRYPTION_KEY}"
      AllowedCorsOrigins: "http://localhost:5173"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs

  # ── Frontend (React 18 / Vite) ───────────────────────────────────────────────
  # Attivare con: docker compose --profile frontend up
  # Prerequisito: il progetto src/DwBuilder.Web deve esistere (npm create vite@latest)
  web:
    build:
      context: src/DwBuilder.Web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000"
    container_name: dw-web
    ports:
      - "5173:80"
    depends_on:
      - api
    profiles:
      - frontend

volumes:
  sqlserver_data:
  api_logs:
